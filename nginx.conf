server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React Router usa rutas del lado del cliente: cualquier ruta que no
    # sea un archivo real cae en index.html para que el router la maneje.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets con hash en el nombre (Vite): cacheables agresivamente.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
